<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', ui-monospace, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @keyframes fd  { to { opacity: 1 } }
      @keyframes fd6 { to { opacity: .55 } }
      @keyframes bl  { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes fk  { 0%,100% { opacity: .05 } 45% { opacity: .11 } 62% { opacity: .03 } }
      .r1 { opacity:0; animation: fd .3s  .4s forwards }
      .r2 { opacity:0; animation: fd .3s 1.0s forwards }
      .r3 { opacity:0; animation: fd .3s 1.5s forwards }
      .gl { opacity:0; animation: fd6 .5s 2.6s forwards }
      .nm { opacity:0; animation: fd .4s 2.6s forwards }
      .r4 { opacity:0; animation: fd .3s 3.4s forwards }
      .r5 { opacity:0; animation: fd .3s 4.0s forwards }
      .cur{ opacity:0; animation: bl 1s 4.2s step-end infinite }
      .scan { animation: fk 3.5s infinite }
    </style>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#39FF14" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- orange ambient glow -->
  <rect x="12" y="12" width="796" height="276" rx="16" fill="none" stroke="#FF5F1F" stroke-width="3" opacity=".30" filter="url(#soft)"/>

  <!-- terminal window -->
  <rect x="12" y="12" width="796" height="276" rx="14" fill="#0b0b0b" stroke="#FF5F1F" stroke-width="2"/>

  <!-- title bar -->
  <circle cx="44" cy="36" r="6" fill="#ff5f56"/>
  <circle cx="66" cy="36" r="6" fill="#ffbd2e"/>
  <circle cx="88" cy="36" r="6" fill="#27c93f"/>
  <text x="410" y="41" text-anchor="middle" font-size="13" fill="#8B949E">jawad@dev — zsh</text>
  <line x1="12" y1="56" x2="808" y2="56" stroke="#FF5F1F" stroke-width="1" opacity=".25"/>

  <!-- HUD corner brackets -->
  <g stroke="#FF5F1F" stroke-width="2" fill="none" opacity=".8">
    <path d="M28 74 L28 66 L36 66"/>
    <path d="M792 74 L792 66 L784 66"/>
    <path d="M28 234 L28 242 L36 242"/>
    <path d="M792 234 L792 242 L784 242"/>
  </g>

  <!-- boot log -->
  <text class="r1" x="46" y="96"  font-size="16" fill="#39FF14"><tspan fill="#FF5F1F">$</tspan> ./launch --profile</text>
  <text class="r2" x="46" y="124" font-size="16" fill="#7CFF9B">[ ok ] modules loaded · env ready</text>

  <!-- progress bar -->
  <g class="r3">
    <rect x="360" y="112" width="240" height="10" rx="5" fill="none" stroke="#39FF14" stroke-width="1" opacity=".5"/>
    <rect x="360" y="112" width="0" height="10" rx="5" fill="#FF5F1F">
      <animate attributeName="width" from="0" to="240" begin="1.6s" dur="1s" fill="freeze"/>
    </rect>
  </g>

  <!-- name -->
  <text class="gl" x="46" y="192" font-size="42" font-weight="700" letter-spacing="2" fill="#FF5F1F" filter="url(#glow)">JAWAD MANSOOR</text>
  <text class="nm" x="46" y="192" font-size="42" font-weight="700" letter-spacing="2" fill="#FF5F1F">JAWAD MANSOOR</text>

  <!-- role + status -->
  <text class="r4" x="48" y="226" font-size="18" fill="#39FF14">&gt; Flutter &amp; Full-Stack Developer</text>
  <text class="r5" x="48" y="258" font-size="15" fill="#7CFF9B">&gt; shipping ideas into products</text>
  <rect class="cur" x="336" y="245" width="11" height="17" fill="#39FF14"/>

  <!-- scanline overlay -->
  <rect class="scan" x="13" y="13" width="794" height="274" rx="13" fill="url(#scan)" opacity=".07"/>
</svg>
